# Redirection HTTP vers HTTPS (chronocarto.tn et www.chronocarto.tn)
server {
    listen 80;
    server_name chronocarto.tn www.chronocarto.tn;
    root /var/www/certbot;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
	try_files $uri =404;
    }

    location / {
        return 301 https://www.chronocarto.tn$request_uri;
    }
}

# Redirection HTTPS chronocarto.tn vers www.chronocarto.tn
server {
    listen 443 ssl;
    server_name chronocarto.tn;

    ssl_certificate /etc/letsencrypt/live/chronocarto.tn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chronocarto.tn/privkey.pem;
  
    location /.well-known/acme-challenge/ {
	root /var/www/certbot;
	try_files $uri = 404;
}

    location / {
        return 301 https://www.chronocarto.tn$request_uri;
    }
}

# Serveur principal HTTPS (www.chronocarto.tn )
server {
    listen 443 ssl;
    server_name www.chronocarto.tn;

    ssl_certificate /etc/letsencrypt/live/chronocarto.tn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chronocarto.tn/privkey.pem;

    # --- SÉCURITÉ ET CORRECTION CONTENU MIXTE ---
    # On supprime les en-têtes envoyés par Next.js qui pourraient contenir des URLs HTTP
    proxy_hide_header Content-Security-Policy;
    
    # On impose une politique stricte qui force le HTTPS
    add_header Content-Security-Policy "upgrade-insecure-requests; default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://www.chronocarto.tn; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    
    # Autres en-têtes de sécurité recommandés
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # --------------------------------------------

    location /.well-known/acme-challenge/ {
	root /var/www/certbot;
	try_files $uri = 404;
    }

    # Frontend (Next.js )
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API (NestJS )
    location /api/ {
        proxy_pass http://backend:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


